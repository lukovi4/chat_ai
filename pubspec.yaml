name: chat_ai
description: >-
  A canonical Flutter chat-with-AI kit: one open conversation per session,
  streaming replies over a pluggable backend, tool use, and chat widgets.
  Private git dependency, not published.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Transport: HTTP + SSE stream, auth token, attestation (V1_SPEC §2, §8).
  # firebase_core deliberately NOT direct: the consuming app initializes
  # Firebase; it arrives transitively via FlutterFire.
  dio: ^5.10.0
  firebase_app_check: ^0.4.5+2
  firebase_auth: ^6.5.6

  # Sealed unions + value models (codegen)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Core (V1_SPEC §2): UUID v4 Message ids / Idempotency-Keys (ADR 0004) and
  # image decode/resize/JPEG re-encode in an isolate (§11).
  image: ^4.9.1
  uuid: ^4.5.3
  gpt_markdown: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
