name: chat_ai_openai_realtime_voice
description: >-
  Optional speech-to-speech voice session for chat_ai: one direct device →
  OpenAI Realtime WebRTC call, ephemeral client secrets minted by the app,
  server-side semantic VAD, one microphone track and one remote assistant
  audio track. NOT a ChatBackend and it does not use ChatSession. Private git
  dependency, not published.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # The core contracts this package reuses (BotProfile, Tool). The core
  # package at the root of this same repository, path-resolved. This package
  # implements NO ChatBackend and uses NO ChatSession.
  chat_ai:
    path: ../..

  # The already-approved ClientSecretProvider contract — the app mints one
  # ephemeral OpenAI Realtime client secret; the standard API key never lands
  # on the device. Reused verbatim; this package does not redefine it.
  chat_ai_openai_realtime:
    path: ../chat_ai_openai_realtime

  # The device WebRTC transport (peer connection + oai-events data channel +
  # one audio-only local track). Pinned EXACTLY to 1.5.2 — the same public API
  # the accepted iOS feasibility probe was physically verified against. No
  # Firebase, no Dio, no Record_transcribe, no codegen/Freezed.
  flutter_webrtc: 1.5.2

  # UUID v4 for the LOCAL per-reply turnIds (never an OpenAI id). Same major as
  # the core `chat_ai` package uses for Message ids.
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # The OPTIONAL native audio recorder. iOS only in this increment — the
      # package registers no Android plugin, so with recordingEnabled == false
      # (or on Android) the voice behaviour is entirely unchanged and no native
      # recorder code runs. No fake Android implementation is declared.
      ios:
        pluginClass: ChatAiRealtimeVoiceRecorderPlugin
