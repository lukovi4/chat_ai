name: example
description: "chat_ai OpenAI-only smoke harness — physical-device test of the real package widgets against a deployed smoke endpoint. Not a production sample app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The packages under test — the real widgets/Core and the two transport
  # adapters, never a fork. The Realtime adapter is a TEST-HARNESS-ONLY
  # dependency of this example (SMOKE_BACKEND=realtime); the three
  # production packages keep their dependency isolation.
  chat_ai:
    path: ../../..
  chat_ai_firebase:
    path: ../
  chat_ai_openai_realtime:
    path: ../../chat_ai_openai_realtime

  # The optional-final-transcript voice session under test
  # (lib/voice_transcript_smoke_main.dart, VOICE_SMOKE_MODE=singleTurn|
  # conversation). A TEST-HARNESS-ONLY dependency of this example; the three
  # production packages keep their dependency isolation.
  chat_ai_openai_realtime_voice:
    path: ../../chat_ai_openai_realtime_voice

  # Firebase attestation for the live smoke path (no provider key on device).
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  firebase_app_check: ^0.4.5+2

  # Image attachment via the Core's OnAttach.
  image_picker: ^1.2.3

  # Increment-0 iOS voice feasibility spike ONLY (lib/voice_probe_main.dart):
  # the WebRTC peer connection + oai-events data channel + one audio-only
  # local track. Pinned EXACTLY to 1.5.2 — the app-local native audio writer
  # uses the public FlutterWebRTCPlugin / LocalAudioTrack headers and the
  # WebRTC-SDK RTCAudioRenderer / RTCAudioTrack headers. Not used by the
  # production packages.
  flutter_webrtc: 1.5.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
