name: chat_ai_openai_realtime
description: >-
  OpenAI Realtime (WebRTC) ChatBackend for chat_ai: one WebRTC session per
  send() leg, ephemeral client secrets minted by the app, stateless
  out-of-band responses, text output. iOS/Android only.
  Private git dependency, not published.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # The backend/event contracts this package implements (ChatBackend,
  # ChatRequest, BackendEvent, models). The core package at the root of
  # this same repository, path-resolved.
  chat_ai:
    path: ../..

  # WebRTC peer connection + `oai-events` data channel on iOS/Android.
  # SDP signaling uses dart:io — no extra HTTP dependency.
  flutter_webrtc: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
