name: chat_ai_openai_realtime
description: >-
  OpenAI Realtime (WebSocket) ChatBackend for chat_ai: one direct
  wss://api.openai.com/v1/realtime session per send() leg, ephemeral client
  secrets minted by the app, stateless out-of-band responses, text output.
  No WebRTC, no microphone/camera. Private git dependency, not published.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # The backend/event contracts this package implements (ChatBackend,
  # ChatRequest, BackendEvent, models). The core package at the root of
  # this same repository, path-resolved.
  chat_ai:
    path: ../..

  # The Realtime transport is a plain WebSocket over `dart:io`
  # (WebSocket.connect with the ephemeral secret as the Bearer header). No
  # third-party transport dependency — dart:io fully covers iOS/Android.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
